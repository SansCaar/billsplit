# Pull requests get area labels from the files they change (actions/labeler).
"area: website":
  - changed-files: [{ any-glob-to-any-file: ["apps/web/**", "packages/assign-ui/**"] }]
"area: extension":
  - changed-files: [{ any-glob-to-any-file: ["apps/extension/**", "packages/assign-ui/**"] }]
"area: walmart orders":
  - changed-files: [{ any-glob-to-any-file: ["packages/core/src/walmart*", "packages/core/src/walmart/**", "apps/extension/src/walmartPage.ts", "packages/core/test/fixtures/walmart/**"] }]
"area: sign-in":
  - changed-files: [{ any-glob-to-any-file: ["apps/web/auth.ts", "apps/web/app/signin/**", "apps/web/app/join/**", "apps/web/components/AuthShell.tsx", "apps/web/components/SignInClient.tsx"] }]
"area: installer":
  - changed-files: [{ any-glob-to-any-file: ["tools/install-extension.sh", "tools/install-extension.ps1", ".github/workflows/release-extension.yml"] }]
documentation:
  - changed-files: [{ any-glob-to-any-file: ["**/*.md", "docs/**"] }]
