name: Feature request or suggestion
description: Something Bill Split should do, or do better
title: "Suggestion: "
labels: ["enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Bill Split better. A sentence or two is plenty.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: e.g. Split Costco orders the same way as Walmart ones
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      placeholder: What are you doing today instead, and what's annoying about it?
  - type: dropdown
    id: where
    attributes:
      label: Where in Bill Split?
      options:
        - Website (groups, expenses, balances, settling up)
        - Chrome extension (the splitter)
        - Reading a Walmart order
        - Signing in or joining a group
        - Installing the extension
        - Something else
